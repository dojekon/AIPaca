name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        id: version
        run: |
          chmod +x scripts/next-version.sh
          scripts/next-version.sh | tee -a "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$(scripts/next-version.sh | sed -n 's/^tag=//p')" >/dev/null; then
            echo "::error::tag already exists"
            exit 1
          fi

      - name: Restore engine cache
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a
          key: engine-${{ hashFiles('scripts/engine-ref.txt', 'scripts/build-engine.sh') }}

      - name: Free disk space
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Build llama.cpp engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        env:
          JOBS: 4
        run: ./scripts/build-engine.sh

      - name: Check engine
        run: |
          test -f app/src/main/jniLibs/arm64-v8a/libllama-server.so
          if compgen -G 'app/src/main/jniLibs/arm64-v8a/libQnn*' >/dev/null; then
            echo "::error::proprietary Qualcomm QNN libraries must not be published"
            exit 1
          fi
          du -sh app/src/main/jniLibs/arm64-v8a

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AIPACA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::secret AIPACA_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "AIPACA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build release APK
        env:
          AIPACA_KEYSTORE_PASSWORD: ${{ secrets.AIPACA_KEYSTORE_PASSWORD }}
          AIPACA_KEY_ALIAS: ${{ secrets.AIPACA_KEY_ALIAS }}
          AIPACA_KEY_PASSWORD: ${{ secrets.AIPACA_KEY_PASSWORD }}
        run: >
          ./gradlew :app:testDebugUnitTest :app:assembleRelease
          -Paipaca.versionName=${{ steps.version.outputs.version }}
          -Paipaca.versionCode=${{ steps.version.outputs.code }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          apk="AiPaca-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          notes_args=(--generate-notes)
          if [ -n "$PREVIOUS" ]; then notes_args+=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$TAG" "$apk" \
            --target "$GITHUB_SHA" \
            --title "AiPaca $TAG" \
            "${notes_args[@]}"
