name: Build engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo swapoff -a || true
          df -h /

      - name: Docker info
        run: docker version

      # scripts/build-engine.sh: клонирует llama.cpp (ревизия из scripts/engine-ref.txt), собирает через cmake
      # preset arm64-android-snapdragon-release в образе
      # ghcr.io/snapdragon-toolchain/arm64-android:v0.8 (NDK r29) и раскладывает
      # результат в app/src/main/jniLibs/arm64-v8a (~184 МБ).
      - name: Build llama.cpp engine
        env:
          JOBS: 4
        run: ./scripts/build-engine.sh

      - name: Upload jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: engine-jniLibs-arm64-v8a
          path: |
            app/src/main/jniLibs/arm64-v8a/
            scripts/engine-version.txt
          if-no-files-found: error
          retention-days: 14
